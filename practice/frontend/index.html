<!DOCTYPE html>
<!--
  ============================================================================
  页面入口（index.html）
  ============================================================================

  这是整个前端唯一的一个 HTML 文件（单页应用 SPA 的核心特征）：
  页面上的所有内容都是 JS 渲染出来的，切换「页面」其实只是换组件，
  浏览器不会真的跳转，也不会重新加载 HTML。

  Vite 在开发时直接把这个文件发给浏览器；
  打包上线时，它也会作为唯一的入口被处理。

  注意：这个文件里几乎没有内容，只有一个空的 <div id="app">。
  打开网页看到的表格、表单、按钮，全部由 Vue 在运行时塞进去。
-->
<html lang="zh-CN">
  <head>
    <!-- 字符编码。
         必须写 utf8，否则中文可能变乱码。
         浏览器在解析 HTML 时一旦遇到中文就会用这个编码解码。 -->
    <meta charset="UTF-8" />

    <!-- 视口设置：让页面在手机上按设备宽度显示，而不是缩成一个小小的桌面版。
         width=device-width  宽度 = 设备宽度
         initial-scale=1.0   初始缩放 1 倍（不放大不缩小） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 浏览器标签页上显示的标题。
         单页应用里如果要改标题，需要在 JS 里改 document.title。 -->
    <title>图书管理练习</title>
  </head>

  <body>
    <!-- 应用挂载点。
         main.js 里 .$mount('#app') 就是找这个 id。
         ★ 注意：Vue 挂载时会把 div 内部的内容「全部替换掉」，
           所以这里有没有内容都无所谓，写东西进去只会一闪而过。 -->
    <div id="app"></div>

    <!-- 入口脚本。
         type="module" 表示按 ES Module 标准加载（支持 import/export），
         现代浏览器才支持；Vite 开发时依赖它实现「不打包直接运行」。
         src="/src/main.js" 是 Vite 的特殊约定：指向源码目录，
         由 Vite 开发服务器实时编译后返回给浏览器。 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
