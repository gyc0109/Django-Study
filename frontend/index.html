<!DOCTYPE html>
<!--============================================================================
  index.html —— 整个前端唯一的 HTML 文件（单页应用 SPA 的入口）

  ============================================================================
  一、为什么只有一个 HTML？
  ============================================================================
  传统网站：每个页面一个 .html 文件，点链接就整页刷新（浏览器重新下载 HTML）。
  单页应用（SPA）：只有一个 index.html，页面切换全靠 JS 偷偷换内容，
                 浏览器地址栏变了，但页面并没有真正刷新。

  本项目只有一个页面，但仍然遵循 SPA 的结构——因为这是前端工程化的标准做法，
  以后加路由（Vue Router）也不用改这个文件。

  ============================================================================
  二、打开页面时发生了什么？（按顺序）
  ============================================================================
  1. 浏览器请求 http://localhost:5173/
  2. Vite 开发服务器把这份 index.html 返回给浏览器
  3. 浏览器解析到 <script type="module" src="/src/main.js">，
     去下载并执行 main.js
  4. main.js 里 import 了 App.vue，Vite 实时把它编译成 JS
  5. Vue 把 App.vue 的内容渲染进 <div id="app"></div>
  6. 用户看到完整界面

  ★ 所以你在浏览器里「查看网页源代码」只能看到这个空壳，
    真正的界面是 JS 执行后才生成的——这对 SEO 不友好，
    但对「后台管理系统 / 学习项目」完全无所谓。
=============================================================================-->
<html lang="zh-CN">
  <head>
    <!-- 字符编码：必须是 UTF-8，否则中文会变成乱码。
         ★ 这一行要尽量靠前，最好在 <title> 之前，
           否则浏览器可能已经用错误的编码解析了一部分内容。 -->
    <meta charset="UTF-8" />

    <!-- 移动端适配：让页面宽度等于设备宽度，初始不缩放。
         没有这一行，手机上打开会看到一个「缩小版的电脑网页」。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 浏览器标签页上显示的文字。
         ★ SPA 的标题一般是「静态的」，因为整页不刷新；
           如果想让每个页面有不同标题，需要在 JS 里动态改 document.title。 -->
    <title>Django Study</title>
  </head>

  <body>
    <!-- ★★★ Vue 的「挂载点」★★★
         这个空的 div 就是整棵 Vue 组件树的落脚处。
         id 必须和 main.js 里的 .$mount('#app') 完全一致，
         改名的话页面会一片空白（而且控制台只报一句很模糊的警告）。

         ★ 注意：挂载后这个 div 的「内部内容」会被 Vue 接管并替换，
           但 div 本身会保留。所以不要在这里预先写 HTML 内容，
           写了也会被覆盖（这一点和「服务端渲染」正好相反）。 -->
    <div id="app"></div>

    <!-- 入口脚本。
         ★ type="module" 的作用（非常重要）：
           1. 让浏览器用 ES Module 的方式加载，可以直接写 import / export；
           2. 模块默认是「延迟执行」的（相当于 defer），
              会等 HTML 解析完再执行，所以不会出现「找不到 #app」的问题。

         ★ 为什么路径写 /src/main.js 而不是 ./src/main.js？
           以 / 开头是「从项目根目录找」，Vite 会把 /src/main.js 当作
           需要编译的源码（.vue 也能 import）；
           写相对路径在某些部署子目录的场景下会失效。

         ★ 浏览器原生并不认识 .vue 文件，是 Vite 在开发时拦截了这个请求，
           现场把它编译成普通 JS 再返回——这就是「开发服务器」的价值。 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
